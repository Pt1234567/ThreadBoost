services:
  postgres:
    image: postgres:16-alpine
    container_name: threadboost-postgres
    environment:
      POSTGRES_DB: threadboost
      POSTGRES_USER: threadboost
      POSTGRES_PASSWORD: threadboost
    ports:
      - "5432:5432"
    volumes:
      - threadboost_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadboost -d threadboost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: threadboost-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: threadboost-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.4
    container_name: threadboost-grafana
    ports:
      - "3000:3000"

volumes:
  threadboost_pg_data:
